name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:firefox
      # The web demo for the product page (docs/demo.md), so a broken one
      # can't reach a release.
      - run: pnpm demo:build
      - run: pnpm size
      - run: pnpm zip
      # Also writes the sources zip addons.mozilla.org asks for, since the
      # package is bundled.
      - run: pnpm zip:firefox
      - uses: actions/upload-artifact@v5
        with:
          name: aloft-chrome
          path: .output/*-chrome.zip
          # .output is a dot directory, which upload-artifact skips otherwise.
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: aloft-demo
          path: .output/demo/aloft-demo-*
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: aloft-firefox
          path: |
            .output/*-firefox.zip
            .output/*-sources.zip
          include-hidden-files: true
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    # A normal run takes about a minute; anything stuck shouldn't hold the
    # runner for GitHub's six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      # Browsers are cached per Playwright version. No --with-deps: the runner
      # image ships Google Chrome, so Chromium's libraries are already there,
      # and apt's mirror sometimes takes minutes. Firefox is for the web
      # demo's tests, which run on an ordinary page.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-firefox
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium firefox
      # The Firefox suite downloads its pinned Firefox on first use.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/aloft-browsers
          key: firefox-${{ runner.os }}-${{ hashFiles('tests/e2e-firefox/fixtures.ts') }}
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results
          path: test-results/

  # Squash merges make the PR title the commit on main, so it's checked here.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      # Through env, never interpolated into the script: titles are untrusted.
      - run: node scripts/check-commit-msg.ts
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
