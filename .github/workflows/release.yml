name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# One run at a time: two quick merges would otherwise both rebuild the release
# PR and push drafted notes to it at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # No token is left in .git/config: only the step that pushes the drafted
      # notes is given one.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # Where the release PR stood before release-please rebuilds its branch,
      # so the notes rewritten there carry over.
      - id: before
        run: |
          head=$(git for-each-ref --count=1 --format='%(objectname)' \
            'refs/remotes/origin/release-please--branches--main*')
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # A personal token, so the release PR triggers CI like any other PR;
          # PRs opened with GITHUB_TOKEN don't. Falls back until one is set.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      # The release PR's branch, which the notes and the screenshots are
      # committed to for the maintainer to look over before merging.
      - if: ${{ steps.release.outputs.pr }}
        uses: jdx/mise-action@v3
      - if: ${{ steps.release.outputs.pr }}
        id: branch
        # GitHub reads env before if, so the PR's JSON is parsed here: fromJSON
        # would fail on the empty output of a run that left the PR alone.
        env:
          PR: ${{ steps.release.outputs.pr }}
        run: |
          BRANCH=$(jq -r .headBranchName <<<"$PR")
          git fetch --tags origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
      # Drafts the version's notes in CHANGELOG.md, for the maintainer to
      # rewrite before merging (docs/releasing.md).
      - if: ${{ steps.branch.outputs.name }}
        env:
          PREVIOUS: ${{ steps.before.outputs.head }}
          # Reads PR bodies for their commit overrides.
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.ts draft "$PREVIOUS"
          if git diff --quiet; then exit 0; fi
          git commit -qam 'docs: draft the release notes'
      # Retakes the store screenshots from what's being released. They're only
      # rewritten when they look different, so this commit means the listing
      # will change; addons.mozilla.org gets them when the release publishes.
      - if: ${{ steps.branch.outputs.name }}
        run: pnpm install --frozen-lockfile
      - if: ${{ steps.branch.outputs.name }}
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.branch.outputs.name }}
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: ${{ steps.branch.outputs.name && steps.browsers.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install chromium
      - if: ${{ steps.branch.outputs.name }}
        run: |
          pnpm screenshots
          git add -A docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm 'docs: update the store screenshots'
      # The same personal token, so the push runs CI on the release PR. It's
      # handed to this one push and nothing else. It also runs when the
      # screenshots failed, so the drafted notes still get there.
      - if: ${{ always() && steps.branch.outputs.name }}
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$BRANCH")" ]; then exit 0; fi
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:$BRANCH"

  upload:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The previous tag, for the release's compare link.
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm zip
      # The sources zip is what addons.mozilla.org's reviewers rebuild the
      # Firefox package from.
      - run: pnpm zip:firefox
      - run: gh release upload "$TAG" .output/*-chrome.zip .output/*-firefox.zip .output/*-sources.zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
      # The release's text is its hand-written notes from CHANGELOG.md, not
      # release-please's list of commits, which the compare link still covers.
      - run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^")
          {
            node scripts/release-notes.ts section "${TAG#v}"
            printf '\n**All changes:** %s/compare/%s...%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$previous" "$TAG"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}

  publish:
    needs: [release-please, upload]
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    secrets: inherit

  # A "release-as" pin in release-please-config.json makes every release that
  # version. Once it's out, the pin has to go, or the next release PR asks
  # for the same version again and fails; this opens that PR.
  unpin:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: pin
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          pinned=$(jq -r '.packages["."]["release-as"] // empty' release-please-config.json)
          if [ "v$pinned" = "$TAG" ]; then echo "pinned=$pinned" >> "$GITHUB_OUTPUT"; fi
      - if: ${{ steps.pin.outputs.pinned }}
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          PINNED: ${{ steps.pin.outputs.pinned }}
        run: |
          branch="chore/unpin-$PINNED"
          # Just the line, so the rest of the file keeps its formatting.
          sed -i '/"release-as":/d' release-please-config.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -qam "chore: stop pinning releases to $PINNED"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:$branch"
          gh pr create --head "$branch" --title "chore: stop pinning releases to $PINNED" \
            --body "$PINNED is out, so the release-as pin comes off; later releases follow the commits again."
