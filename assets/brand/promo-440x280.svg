<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280">
  <title>Aloft</title>
  <!-- The logo's bar, grown into a search box with words in it, so the tile
       says "search bar" at thumbnail size. Text is set in Sora, which
       scripts/brand.ts loads before rendering; elsewhere it falls back to a
       system sans. Name 40px over the bar, subtitle 17px under it, centred
       on 140 as a group (52 to 218). -->
  <rect width="440" height="280" fill="#2F6FEB"/>
  <text x="220" y="82" text-anchor="middle" font-family="Sora, sans-serif" font-weight="700" font-size="40" letter-spacing="-1.6" fill="#FFFFFF">Aloft</text>
  <rect x="56" y="110" width="328" height="56" rx="28" fill="#FFFFFF"/>
  <circle cx="88" cy="136" r="8" fill="none" stroke="#2F6FEB" stroke-width="4"/>
  <path d="M94 142 L100 148" stroke="#2F6FEB" stroke-width="4" stroke-linecap="round"/>
  <text x="116" y="144" font-family="Sora, sans-serif" font-size="17" fill="#5B6B8C">Search tabs, history…</text>
  <text x="220" y="214" text-anchor="middle" font-family="Sora, sans-serif" font-weight="500" font-size="17" fill="#FFFFFF" fill-opacity="0.88">A command bar for your browser</text>
</svg>
