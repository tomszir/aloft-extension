  <circle cx="128.5" cy="116" r="10" fill="none" stroke="#2F6FEB" stroke-width="5"/>
  <path d="M136 123.5 L143.5 131" stroke="#2F6FEB" stroke-width="5" stroke-linecap="round"/>
  <rect x="158" y="111" width="166" height="14" rx="7" fill="#2F6FEB" opacity="0.18"/>
  <rect x="145" y="178" width="150" height="16" rx="8" fill="#FFFFFF" opacity="0.45"/>
</svg>
