onboardingCtrlTTitle: Open with Ctrl+T
onboardingCtrlTMoved: Aloft no longer takes over new tabs, which showed a blank tab for a moment each time. Ctrl+T now opens Aloft only once you give it to Aloft, which takes two steps below. Until then, Aloft's own shortcut still opens it.
ctrlTBody: Ctrl+T can open Aloft over the page you're on instead of an empty tab. Browsers only let you set that yourself, in two steps.
ctrlTStepOpen: Open your browser's shortcuts for extensions.
ctrlTStepSet: Find "$1" under Aloft, and press Ctrl+T in its box.
ctrlTButton: Open shortcut settings
ctrlTNote: Alt+Q keeps working too. For an empty tab, type > new tab in Aloft.
ctrlTDone: Done. Ctrl+T opens Aloft over the page you're on. For an empty tab, type > new tab in Aloft.
