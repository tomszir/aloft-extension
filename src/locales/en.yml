ctrlTButton: Open shortcut settings
ctrlTNote: Alt+Q keeps working too. For an empty tab, type > new tab in Aloft.
ctrlTDone: Done. Ctrl+T opens Aloft over the page you're on. For an empty tab, type > new tab in Aloft.
